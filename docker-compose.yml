version: '3'

services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=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
      - DB_HOST=db
      - DB_NAME=guess_game
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - db
      - redis

  db:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_DB: guess_game
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
